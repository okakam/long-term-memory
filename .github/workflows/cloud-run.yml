name: cloud-run

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11.1.3

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: NODE_ENV=production pnpm build
      - run: docker build --tag long-term-memory:test .

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: cloud-run-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - run: |
          gcloud run deploy long-term-memory \
            --source . \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region asia-northeast1 \
            --allow-unauthenticated \
            --min 0 --max 1 --concurrency 1 \
            --cpu 1 --memory 512Mi --timeout 300 \
            --service-account "${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --set-env-vars "LTM_STORAGE_DRIVER=cloud,AUTH_REQUIRED=1,AWS_REGION=${{ vars.AWS_REGION }},LTM_S3_BUCKET=${{ vars.LTM_S3_BUCKET }},LTM_S3_PREFIX=${{ vars.LTM_S3_PREFIX }},FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }},NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }},NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }},NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }},NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }},MCP_PUBLIC_URL=${{ vars.MCP_PUBLIC_URL }},MCP_ALLOWED_ORIGINS=${{ vars.MCP_ALLOWED_ORIGINS }},LTM_CURATOR_USER_ID=${{ vars.LTM_CURATOR_USER_ID }}" \
            --set-secrets "AWS_ACCESS_KEY_ID=${{ vars.GCP_SECRET_AWS_ACCESS_KEY_ID }}:latest,AWS_SECRET_ACCESS_KEY=${{ vars.GCP_SECRET_AWS_SECRET_ACCESS_KEY }}:latest,LTM_MAINTENANCE_TOKEN=${{ vars.GCP_SECRET_LTM_MAINTENANCE_TOKEN }}:latest"
      - name: Cloud Run smoke
        env:
          CLOUD_RUN_URL: ${{ secrets.CLOUD_RUN_URL }}
          LTM_MCP_TOKEN: ${{ secrets.LTM_MCP_TOKEN }}
          LTM_SMOKE_PROJECT_ID: smoke
        run: |
          corepack enable
          pnpm dlx tsx scripts/cloud-run-smoke.ts
