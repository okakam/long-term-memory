name: curator

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run maintenance and shared curation without writes'
        required: false
        default: true
        type: boolean
      from_date:
        description: 'Shared curation UTC start date (YYYY-MM-DD); provide with to_date'
        required: false
        type: string
      to_date:
        description: 'Shared curation UTC end date, exclusive (YYYY-MM-DD); provide with from_date'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ltm-curator
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11.1.3
  CURATOR_DRY_RUN: ${{ github.event_name == 'schedule' && '0' || (inputs.dry_run && '1' || '0') }}

jobs:
  memory-maintenance:
    # The runner must have the Claude CLI installed and authenticated.
    runs-on: [self-hosted, ltm-curator]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run automated memory maintenance
        env:
          MCP_PUBLIC_URL: ${{ secrets.MCP_PUBLIC_URL }}
          LTM_AUTO_MAINTENANCE_TOKEN: ${{ secrets.LTM_AUTO_MAINTENANCE_TOKEN }}
          DRY_RUN: ${{ env.CURATOR_DRY_RUN }}
          CLAUDE_BIN: claude
        run: |
          umask 077
          pnpm exec tsx scripts/curator/run-maintenance.ts

  remote-curation:
    # The runner must have the Claude CLI installed and authenticated.
    needs: memory-maintenance
    if: always() && !cancelled()
    runs-on: [self-hosted, ltm-curator]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run dated shared curation
        env:
          MCP_PUBLIC_URL: ${{ secrets.MCP_PUBLIC_URL }}
          LTM_MCP_TOKEN: ${{ secrets.LTM_MCP_TOKEN }}
          LTM_MAINTENANCE_TOKEN: ${{ secrets.LTM_MAINTENANCE_TOKEN }}
          DRY_RUN: ${{ env.CURATOR_DRY_RUN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
          CLAUDE_BIN: claude
        run: |
          umask 077
          pnpm exec tsx scripts/curator/run-dated-curation.ts
