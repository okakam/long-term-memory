name: curator

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without shared-memory writes'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11.1.3
  CURATOR_DRY_RUN: ${{ github.event_name == 'schedule' && '0' || (inputs.dry_run && '1' || '0') }}

jobs:
  remote-curation:
    # The runner must have the Claude CLI installed and authenticated.
    runs-on: [self-hosted, ltm-curator]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export sanitized remote snapshot
        env:
          MCP_PUBLIC_URL: ${{ secrets.MCP_PUBLIC_URL }}
          LTM_MCP_TOKEN: ${{ secrets.LTM_MCP_TOKEN }}
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/ltm-curator"
          pnpm tsx scripts/curator/export-remote-snapshot.ts --output "$RUNNER_TEMP/ltm-curator/snapshot.md"
      - name: Run headless curator
        env:
          LTM_MCP_TOKEN: ${{ secrets.LTM_MCP_TOKEN }}
          LTM_MAINTENANCE_TOKEN: ${{ secrets.LTM_MAINTENANCE_TOKEN }}
          LTM_SNAPSHOT: ${{ runner.temp }}/ltm-curator/snapshot.md
          LTM_CURATOR_MCP_CONFIG: ${{ github.workspace }}/docs/mcp-config.vercel.json
          LTM_CURATOR_LOG_DIR: ${{ runner.temp }}/ltm-curator/logs
          LTM_CURATOR_ENV: ${{ runner.temp }}/ltm-curator/env
          LTM_MODE: remote
          DRY_RUN: ${{ env.CURATOR_DRY_RUN }}
          LTM_STORE: ${{ runner.temp }}/ltm-curator
          CLAUDE_BIN: claude
        run: |
          umask 077
          cat > "$LTM_CURATOR_ENV" <<ENV
          LTM_MODE=remote
          DRY_RUN=$DRY_RUN
          LTM_STORE=$LTM_STORE
          LTM_SNAPSHOT=$LTM_SNAPSHOT
          LTM_CURATOR_MCP_CONFIG=$LTM_CURATOR_MCP_CONFIG
          LTM_CURATOR_LOG_DIR=$LTM_CURATOR_LOG_DIR
          CLAUDE_BIN=$CLAUDE_BIN
          LTM_CURATOR_PATH=$PATH
          ENV
          bash -n scripts/curator/run-curation.sh
          DRY_RUN="$DRY_RUN" LTM_CURATOR_ENV="$LTM_CURATOR_ENV" bash scripts/curator/run-curation.sh
