name: long-term-memory-dev

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        NODE_IMAGE: node:22-bookworm-slim
        PNPM_VERSION: 11.1.3
        CODEX_VERSION: 0.153.4
    working_dir: /workspace
    # sshd は特権ポートと /run/sshd を必要とするため、PID 1 は root で起動する。
    # devcontainer.json の remoteUser は node のままなので、通常の開発操作は node で行う。
    user: root
    security_opt:
      - seccomp:unconfined
    command: ["/usr/local/bin/start-devcontainer-sshd"]
    stdin_open: true
    tty: true
    ports:
      - "3000:3000"
      - "3939:3939"
      - "127.0.0.1:2222:22"
    environment:
      AUTH_REQUIRED: "0"
      COREPACK_HOME: /pnpm/.corepack
      CODEX_HOME: /home/node/.codex
      LTM_HOME: /workspace/.long-term-memory
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      PATH: /pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PNPM_HOME: /pnpm
    volumes:
      - type: bind
        source: ..
        target: /workspace
      - type: volume
        source: node_modules
        target: /workspace/node_modules
      - type: volume
        source: codex_data
        target: /home/node/.codex
      - type: volume
        source: cloud_cli_data
        target: /home/node/.config

volumes:
  node_modules:
    name: long-term-memory-node_modules
  codex_data:
    name: long-term-memory-codex
  cloud_cli_data:
    name: long-term-memory-cloud-cli
